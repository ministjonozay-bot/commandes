<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Commande</title>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
(function(){
  emailjs.init("v63ixvVCNyzUDxCmu"); // 👈 ici
})();
</script>
</head>

<body>

<form id="form">
  <input type="text" name="nom" placeholder="Nom complet" required>
  <input type="email" name="email" placeholder="Email" required>

  <select name="quantite">
    <option value="5">5</option>
    <option value="10">10</option>
    <option value="15">15</option>
  </select>

  <textarea name="indication" placeholder="Indication"></textarea>

  <button type="submit">Envoyer</button>
</form>

<script>
document.getElementById("form").addEventListener("submit", function(e){
  e.preventDefault();

  emailjs.send("service_d9owzjk", "template_pzs8mo8", {
    nom: this.nom.value,
    email: this.email.value,
    quantite: this.quantite.value,
    indication: this.indication.value
  })
  .then(() => alert("Commande envoyée ✅"))
  .catch(() => alert("Erreur ❌"));
});
</script>

</body>
</html>
