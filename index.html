<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Commande d'allume-feux</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
(function(){
  emailjs.init("v63ixvVCNyzUDxCmu");
})();
</script>

<style>
* {
  box-sizing: border-box;
  font-family: 'Inter', sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(135deg, #1b5e20, #4caf50);
  display: flex;
  align-items: center;
  justify-content: center;
}

.card {
  background: white;
  width: 100%;
  max-width: 420px;
  padding: 30px;
  border-radius: 14px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.2);
}

h1 {
  margin: 0 0 20px;
  text-align: center;
  color: #1b5e20;
}

label {
  font-weight: 600;
  font-size: 14px;
  margin-top: 14px;
  display: block;
}

input, select, textarea {
  width: 100%;
  margin-top: 6px;
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 14px;
  transition: 0.2s;
}

input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: #4caf50;
  box-shadow: 0 0 0 2px rgba(76,175,80,0.2);
}

textarea {
  resize: none;
}

button {
  margin-top: 20px;
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  font-weight: 600;
  color: white;
  background: linear-gradient(135deg, #2e7d32, #66bb6a);
  cursor: pointer;
  transition: transform 0.1s, box-shadow 0.1s;
}

button:hover {
  transform: translateY(-1px);
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
}

.status {
  margin-top: 15px;
  text-align: center;
  font-size: 14px;
}

#prix {
  margin-top: 10px;
  font-size: 20px;
  color: #1b5e20;
  text-align: center;
}

</style>
</head>

<body>

<div class="card">
  <h1>Commande d’allume-feux</h1>

  <form id="form">
    <label>Nom complet</label>
    <input type="text" name="nom" required>

    <label>Email</label>
    <input type="email" name="email" required>

    <label>Quantité</label>
    <select name="quantite" id="quantite">
      <option value="10">10</option>
      <option value="20">20</option>
    </select>

    <div id="prix">Prix : <strong>5 €</strong></div>


    <label>Indication (optionnel)</label>
    <textarea name="indication" rows="3"></textarea>

    <button type="submit">Envoyer la commande</button>
    <div class="status" id="status"></div>
  </form>
</div>

<script>
document.getElementById("form").addEventListener("submit", function(e){
  e.preventDefault();
  document.getElementById("status").textContent = "Envoi en cours...";

  emailjs.send("service_d9owzjk", "template_pzs8mo8", {
    nom: this.nom.value,
    email: this.email.value,
    quantite: this.quantite.value,
    indication: this.indication.value
  })
  .then(() => {
    document.getElementById("status").textContent = "Commande envoyée ✅";
    this.reset();
  })
  .catch(() => {
    document.getElementById("status").textContent = "Erreur lors de l’envoi ❌";
  });
});
</script>
<script>
const quantite = document.getElementById("quantite");
const prix = document.getElementById("prix");

function updatePrix() {
  if (quantite.value === "10") {
    prix.innerHTML = "Prix : <strong>5 €</strong>";
  } else {
    prix.innerHTML = "Prix : <strong>10 €</strong>";
  }
}

quantite.addEventListener("change", updatePrix);
updatePrix(); // au chargement
</script>

</body>
</html>
